<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BeliBeli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <main class="login-card">
        <div class="brand-logo">🅱️</div>
        <h1>BeliBeli</h1>
        <p class="login-sub">Masuk Dan Nikmati Belanja Dengan Harga Hemat</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username"
                    placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password"
                    placeholder="Masukkan password">
            </div>

            <button type="submit" id="loginBtn" class="btn-block">Masuk</button>
            <p id="loginMessage" class="message error" role="alert"></p>
        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
